name: Backfill Canonical Study Libraries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and derive only; do not write Firestore'
        type: boolean
        default: true
      vocab_only:
        description: 'Run only the per-date vocabulary backfill'
        type: boolean
        default: false
      from:
        description: 'Inclusive vocabulary start date (YYYY-MM-DD); use printed resume date'
        type: string
        required: false
      to:
        description: 'Inclusive vocabulary end date (YYYY-MM-DD)'
        type: string
        required: false
      max_dates:
        description: 'Maximum publication dates in this chunk'
        type: string
        default: '30'
      prune_schemes:
        description: 'Delete rejected legacy scheme names (ignored for vocabulary-only runs)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canonical-study-library-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/content-scraper/package-lock.json

      - name: Install locked dependencies
        working-directory: backend/content-scraper
        run: npm ci

      - name: Run scraper tests
        working-directory: backend/content-scraper
        run: npm test

      - name: Check backfill script syntax
        working-directory: backend/content-scraper
        run: |
          node --check backfill.js
          node --check vocabulary-pipeline.js
          node --check vocab-extract.js

      - name: Run bounded canonical backfill
        working-directory: backend/content-scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_MAX_DATES: ${{ inputs.max_dates }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_VOCAB_ONLY: ${{ inputs.vocab_only }}
        run: |
          args=(--max-dates "${INPUT_MAX_DATES:-30}")
          if [ -n "$INPUT_FROM" ]; then args+=(--from "$INPUT_FROM"); fi
          if [ -n "$INPUT_TO" ]; then args+=(--to "$INPUT_TO"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_VOCAB_ONLY" = "true" ]; then args+=(--vocab-only); fi
          node backfill.js "${args[@]}"

      - name: Audit legacy scheme names
        if: ${{ !inputs.vocab_only }}
        working-directory: backend/content-scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PRUNE: ${{ inputs.prune_schemes }}
        run: |
          if [ "$INPUT_PRUNE" = "true" ]; then
            args=(--prune)
            if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
            node audit-schemes.js "${args[@]}"
          else
            node audit-schemes.js
          fi
