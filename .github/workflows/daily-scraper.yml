name: Daily UPSC Content Scraper

on:
  schedule:
    # Monday-Saturday. Each cron's UTC calendar date is also the intended IST
    # publication date (the 18:00 UTC slot is 23:30 IST). The workflow passes
    # that UTC date explicitly, so a queued run crossing midnight in India does
    # not accidentally scrape the following day.
    - cron: '30 1 * * 1-6'   # 7:00 AM IST
    - cron: '30 6 * * 1-6'   # 12:00 PM IST
    - cron: '30 12 * * 1-6'  # 6:00 PM IST
    - cron: '0 18 * * 1-6'   # 11:30 PM IST
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      date:
        description: 'Specific date to scrape (YYYY-MM-DD). Leave empty for today.'
        required: false
      days:
        description: 'Number of past days to scrape (e.g., 3 for last 3 days)'
        required: false
        default: '1'
      dry_run:
        description: 'Dry run (no upload)'
        type: boolean
        default: false

concurrency:
  group: daily-content-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/content-scraper/package-lock.json

      - name: Install dependencies
        working-directory: backend/content-scraper
        run: npm ci || npm install

      - name: Test parsers
        working-directory: backend/content-scraper
        run: npm test

      - name: Run scraper
        working-directory: backend/content-scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          ARGS=""

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Use the cron slot's UTC date, not delayed runner wall-clock in IST.
            # The 18:00 UTC run may start after midnight IST but still belongs to
            # the UTC date (23:30 IST publication day).
            ARGS="--date $(date -u +%F)"
          elif [ "${{ github.event.inputs.date }}" != "" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          elif [ "${{ github.event.inputs.days }}" != "" ] && [ "${{ github.event.inputs.days }}" != "1" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          
          node index.js $ARGS

      - name: Log completion
        if: success()
        run: echo "✅ Content scraping completed successfully at $(date -u '+%Y-%m-%d %H:%M UTC')"
        
      - name: Notify on failure
        if: failure()
        run: echo "❌ Content scraping FAILED at $(date -u '+%Y-%m-%d %H:%M UTC')"
