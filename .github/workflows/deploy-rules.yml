name: Deploy Firestore Rules

# Deploys firestore.rules through the Firebase Rules REST API rather than the
# Firebase CLI.
#
# `firebase deploy --only firestore:rules` first asks Service Usage whether
# firestore.googleapis.com is enabled. The Admin SDK service account has no
# `serviceusage.services.get` permission, so that precheck 403s and the deploy
# never starts — even though the same account can write rules perfectly well.
# Granting the extra IAM role would also fix it; talking to the Rules API
# directly avoids needing console access at all.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.github/workflows/deploy-rules.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/content-scraper/package-lock.json

      - name: Install dependencies
        working-directory: backend/content-scraper
        run: npm ci || npm install

      - name: Deploy Firestore rules
        working-directory: backend/content-scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: node deploy-rules.js
