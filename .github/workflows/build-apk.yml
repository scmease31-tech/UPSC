name: Build & Release APK

on:
  # Tagged releases only. Pushes to main are handled by publish-pages.yml, which
  # builds the signed APK and atomically publishes it + version.json to Pages;
  # this workflow owns the tagged GitHub Release so the two never collide.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # Fail the release on real analyzer errors; the repo still carries a
        # backlog of style lints, so warnings/infos must not block a build.
        run: flutter analyze --no-pub 2>&1 | tee analyze.log; ! grep -qE '^\s*error' analyze.log

      - name: Test
        run: flutter test --no-pub

      - name: Setup signing keystore
        env:
          # Set all three in Settings > Secrets and variables > Actions.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Secrets first entered from Windows PowerShell may contain a trailing
          # CR/LF. keytool treats that as part of the password and reports only
          # exit code 1, so normalize line endings before validation.
          KEYSTORE_PASSWORD=$(printf '%s' "${KEYSTORE_PASSWORD:-}" | tr -d '\r\n')
          KEY_PASSWORD=$(printf '%s' "${KEY_PASSWORD:-}" | tr -d '\r\n')
          export KEYSTORE_PASSWORD KEY_PASSWORD
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD and KEY_PASSWORD secrets must be set."
            exit 1
          fi
          # KEYSTORE_BASE64 now holds a JKS directly, so it is written straight
          # into place. The previous version decoded a PKCS12 and converted it,
          # then scraped the generated alias back out of keytool's output - all
          # of which existed only because the original secret happened to be a
          # .p12. The alias is known ("upload"), so none of that is needed.
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          # Verify the keystore password and detect its existing private-key
          # alias. Historical releases used alias "1" while a later workflow
          # assumed "upload"; hardcoding either one breaks the other.
          if ! KEYSTORE_LIST=$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" 2>&1); then
            KEYSTORE_FORMAT=$(file -b android/app/upload-keystore.jks)
            echo "::error::Unable to open KEYSTORE_BASE64 with KEYSTORE_PASSWORD. Decoded file type: $KEYSTORE_FORMAT"
            printf '%s\n' "$KEYSTORE_LIST" | tail -n 3
            exit 1
          fi
          ALIAS=$(printf '%s\n' "$KEYSTORE_LIST" | sed -n 's/^Alias name: //p' | head -1)
          if [ -z "$ALIAS" ]; then
            echo "::error::No signing-key alias found in KEYSTORE_BASE64."
            exit 1
          fi
          ACTUAL_SHA1=$(printf '%s\n' "$KEYSTORE_LIST" | sed -n 's/.*SHA1: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          CONFIGURED_SHA1=$(python3 -c "import json; d=json.load(open('android/app/google-services.json')); print(next(x['android_info']['certificate_hash'] for x in d['client'][0]['oauth_client'] if x.get('client_type') == 1))")
          if [ "$ACTUAL_SHA1" != "$CONFIGURED_SHA1" ]; then
            echo "::warning::Google Sign-In will fail in this APK: upload key SHA-1 $ACTUAL_SHA1 is not registered in google-services.json/Firebase (configured $CONFIGURED_SHA1). Add the upload-key SHA-1 in Firebase Console and download a refreshed google-services.json."
          fi
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$ALIAS
          storeFile=upload-keystore.jks
          EOF
          # Deliberately NOT `cat`-ing key.properties: this repo is public, so
          # Actions logs are public.

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --split-per-abi

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            APP_VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
            if [ -z "$APP_VERSION" ]; then
              echo "::error::Could not read version from pubspec.yaml"
              exit 1
            fi
            echo "tag=v$APP_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/UPSC-Daily-Edge.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm32.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "UPSC Daily Edge ${{ steps.version.outputs.tag }}"
          body: |
            ## How to get this

            **Already have the app?** Open it and accept the update prompt. The app downloads the new version, verifies its SHA-256, and hands it to Android to install. Nothing here needs downloading by hand.

            **New install?** Use the download on the project page. That is the universal APK the in-app updater manages, so updates keep working afterwards.

            The APKs attached below are smaller per-architecture builds, for devices the universal APK will not fit. They carry a lower version code than the published build, so the app will offer an update the first time you open it — that is expected, and it moves you onto the managed universal build.

            If version 1.4.0 or older is installed, uninstall it once first: Android signing was reset after that release, so updating over it is refused. Nothing since then needs a reinstall.

            ## What's in the app

            - 📰 Daily current affairs from Drishti IAS and Insights on India
            - 🧠 A daily quiz generated from that day's articles, plus topic quizzes with XP
            - 📝 Flashcards, revision notes and mnemonics
            - 📊 Streaks and progress tracking
            - ⬇️ In-app updates, downloaded and SHA-256 verified inside the app

            Android always shows its own final install confirmation. The app never installs anything silently.

            ## Installing an APK by hand

            1. Download the APK
            2. Open it on the device
            3. Allow installation from unknown sources if prompted
          files: |
            build/app/outputs/flutter-apk/UPSC-Daily-Edge.apk
            build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm64.apk
            build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm32.apk
          draft: false
          prerelease: false

      # This workflow does NOT touch gh-pages. publish-pages.yml owns every file
      # served from Pages — update/version.json, update/UPSC-Daily-Edge.apk and
      # the root APK the landing page links to.
      #
      # The reason is the build number. versionCode here comes straight from
      # pubspec (android/app/build.gradle.kts uses flutter.versionCode with no
      # per-ABI override, so every split shares it), while publish-pages derives
      # BASE + GITHUB_RUN_NUMBER, which is always higher. Publishing from here
      # would move Pages BACKWARDS, and Android refuses to install an APK whose
      # versionCode is below the installed one.
      #
      # Leaving Pages alone also makes these assets self-healing: a release APK
      # sits below the published build, so the in-app updater offers the managed
      # universal APK on first launch and pulls that user onto the normal
      # channel. That only holds while this workflow does not stamp its own
      # higher build number — do NOT add --build-number here.
