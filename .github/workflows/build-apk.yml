name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # Fail the release on real analyzer errors; the repo still carries a
        # backlog of style lints, so warnings/infos must not block a build.
        run: flutter analyze --no-pub 2>&1 | tee analyze.log; ! grep -qE '^\s*error' analyze.log

      - name: Test
        run: flutter test --no-pub

      - name: Setup signing keystore
        env:
          # Set all three in Settings > Secrets and variables > Actions.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD and KEY_PASSWORD secrets must be set."
            exit 1
          fi
          # KEYSTORE_BASE64 now holds a JKS directly, so it is written straight
          # into place. The previous version decoded a PKCS12 and converted it,
          # then scraped the generated alias back out of keytool's output - all
          # of which existed only because the original secret happened to be a
          # .p12. The alias is known ("upload"), so none of that is needed.
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          # Fail here rather than midway through Gradle if the secret is stale
          # or the password is wrong.
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias upload > /dev/null
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          # Deliberately NOT `cat`-ing key.properties: this repo is public, so
          # Actions logs are public.

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --split-per-abi

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/UPSC-Daily-Edge.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm32.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "UPSC Daily Edge ${{ steps.version.outputs.tag }}"
          body: |
            ## UPSC Daily Edge - Android App

            ### What's included:
            - 📰 Daily Current Affairs from Drishti IAS & Insights on India
            - 🧠 Smart Quizzes with XP tracking
            - 📝 Flash Revision cards & mnemonics
            - 📊 Progress tracking & streaks

            ### Install:
            1. Download **UPSC-Daily-Edge.apk** (recommended, works on most devices)
            2. Open it on your Android device
            3. Allow installation from unknown sources if prompted
            4. Done!

            > If the main APK doesn't work on your device, try the arm32 variant.
          files: |
            build/app/outputs/flutter-apk/UPSC-Daily-Edge.apk
            build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm64.apk
            build/app/outputs/flutter-apk/UPSC-Daily-Edge-${{ steps.version.outputs.tag }}-arm32.apk
          draft: false
          prerelease: false

      - name: Deploy APK to GitHub Pages
        run: |
          cp build/app/outputs/flutter-apk/UPSC-Daily-Edge.apk /tmp/UPSC-Daily-Edge.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/UPSC-Daily-Edge.apk UPSC-Daily-Edge.apk
          git add UPSC-Daily-Edge.apk
          git commit -m "Update APK to ${{ steps.version.outputs.tag }}" || true
          git push origin gh-pages
